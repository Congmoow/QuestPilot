name: Build and Release

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 tag，例如 v1.6.7'
        required: true
        type: string
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            bundle_dir: nsis
            bundle_glob: src-tauri/target/release/bundle/nsis/*.exe
            bundle_ext: "*.exe"
            verify_msg: "未找到 Tauri NSIS 安装包"
          - os: macos-latest
            bundles: dmg
            bundle_dir: dmg
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg
            bundle_ext: "*.dmg"
            verify_msg: "未找到 Tauri DMG 安装包"

    steps:
      - name: Checkout tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set Tag Name
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${{ github.event.release.tag_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${{ inputs.tag_name }}"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${{ github.ref_name }}"
          }

      - name: Build Tauri Installer
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Verify Tauri Assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path "src-tauri/target/release/bundle/${{ matrix.bundle_dir }}" -Filter "${{ matrix.bundle_ext }}"
          if (-not $assets) {
            throw "${{ matrix.verify_msg }}"
          }
          $assets | ForEach-Object {
            Write-Host "Found release asset: $($_.FullName)"
          }

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ matrix.bundle_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
