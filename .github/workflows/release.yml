name: Build and Release

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 tag，例如 v1.6.7'
        required: true
        type: string
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]
        # 如需支持多平台，取消下面的注释
        # os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set Tag Name
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${{ github.event.release.tag_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${{ inputs.tag_name }}"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${{ github.ref_name }}"
          }

      - name: Build Tauri Installer
        run: npm run tauri:build

      - name: Verify Tauri Assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe"
          if (-not $assets) {
            throw "未找到 Tauri NSIS 安装包"
          }
          $assets | ForEach-Object {
            Write-Host "Found release asset: $($_.FullName)"
          }

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
